<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quick Note</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="note-card">
      <header class="page-header">
        <div>
          <h1>Quick Note</h1>
          <p>Write a note and your draft will be saved automatically.</p>
        </div>
        <button id="theme-toggle" type="button">Dark mode</button>
      </header>

      <label for="note-text">Your note</label>
      <textarea id="note-text" rows="8" placeholder="Start writing..."></textarea>

      <div class="note-footer">
        <div class="counts" aria-live="polite">
          <p id="char-count">0 / 200 characters</p>
          <p id="word-count">0 words</p>
        </div>
        <button id="clear-btn" type="button">Clear note</button>
      </div>
    </main>
  </body>
</html>
